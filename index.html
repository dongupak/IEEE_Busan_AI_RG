<meta charset="UTF-8">

<style>
  :root{
    --navy:#0b2a4a;
    --blue:#1a5fb4;
    --accent:#00629b;      /* IEEE blue */
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1c2733;
    --muted:#5a6b7b;
    --line:#e2e8f0;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    line-height:1.7;
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}

  /* Header */
  header.hero{
    background:linear-gradient(135deg,var(--navy) 0%,var(--accent) 100%);
    color:#fff;
    padding:56px 20px 48px;
    text-align:center;
  }
  header.hero .badge{
    display:inline-block;
    font-size:.8rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    background:rgba(255,255,255,.15);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:18px;
  }
  header.hero h1{
    margin:0 0 10px;
    font-size:clamp(1.6rem,4vw,2.6rem);
    font-weight:800;
    letter-spacing:-.01em;
  }
  header.hero p{
    margin:0 auto;
    max-width:680px;
    color:rgba(255,255,255,.85);
    font-size:1.05rem;
  }

  /* Nav */
  nav.toc{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav.toc .inner{
    max-width:1080px;margin:0 auto;
    display:flex;gap:8px;flex-wrap:wrap;
    padding:12px 20px;justify-content:center;
  }
  nav.toc a{
    font-size:.9rem;font-weight:600;color:var(--muted);
    padding:6px 14px;border-radius:999px;border:1px solid var(--line);
    background:#fff;transition:.2s;
  }
  nav.toc a:hover{color:#fff;background:var(--accent);border-color:var(--accent);text-decoration:none;}

  main{max-width:1080px;margin:0 auto;padding:40px 20px 60px;}

  /* Lecture card */
  .lecture{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 30px;
    margin-bottom:34px;
    box-shadow:0 4px 18px rgba(11,42,74,.05);
    scroll-margin-top:70px;
  }
  .lecture .tag{
    display:inline-block;
    background:var(--accent);color:#fff;
    font-size:.8rem;font-weight:700;
    padding:4px 12px;border-radius:8px;margin-bottom:14px;
  }
  .lecture h2{
    margin:0 0 6px;font-size:1.4rem;color:var(--navy);line-height:1.4;
  }
  .lecture .sub{color:var(--muted);font-size:1rem;margin:0 0 18px;font-weight:600;}
  .meta{
    display:grid;grid-template-columns:auto 1fr;gap:6px 14px;
    margin:0 0 18px;font-size:.96rem;
  }
  .meta dt{color:var(--muted);font-weight:700;white-space:nowrap;}
  .meta dd{margin:0;}
  .desc{
    color:#2c3947;font-size:.97rem;
    background:#f8fafc;border-left:3px solid var(--accent);
    padding:14px 18px;border-radius:0 8px 8px 0;margin:0 0 20px;
    white-space:pre-line;
  }
  .files{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .files a{
    display:inline-flex;align-items:center;gap:6px;
    background:#eef4fb;color:var(--accent);font-weight:600;font-size:.9rem;
    padding:8px 14px;border-radius:8px;border:1px solid #d7e6f5;transition:.2s;
  }
  .files a:hover{background:var(--accent);color:#fff;text-decoration:none;}

  /* Gallery */
  .gallery-title{font-size:.9rem;font-weight:700;color:var(--muted);margin:0 0 10px;}
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:10px;
  }
  .gallery img{
    width:100%;height:120px;object-fit:cover;
    border-radius:8px;cursor:pointer;border:1px solid var(--line);
    transition:transform .2s,box-shadow .2s;background:#eee;
  }
  .gallery img:hover{transform:scale(1.03);box-shadow:0 6px 16px rgba(0,0,0,.18);}

  /* Lightbox */
  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.9);
    display:none;align-items:center;justify-content:center;z-index:100;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .lightbox .close{
    position:absolute;top:20px;right:28px;color:#fff;font-size:2.2rem;
    cursor:pointer;line-height:1;user-select:none;
  }
  .lightbox .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    color:#fff;font-size:3rem;cursor:pointer;padding:0 20px;user-select:none;opacity:.7;
  }
  .lightbox .nav:hover{opacity:1;}
  .lightbox .prev{left:0;}
  .lightbox .next{right:0;}

  footer{
    text-align:center;color:var(--muted);font-size:.9rem;
    padding:30px 20px 50px;border-top:1px solid var(--line);
  }
  footer a{font-weight:600;}
  @media(max-width:520px){
    .lecture{padding:22px 18px;}
    .meta{grid-template-columns:1fr;gap:2px 0;}
    .meta dt{margin-top:8px;}
  }
</style>
</head>

      "이미지-20260225-073355-024a02df.jpeg",
      "이미지-20260225-075924-d5a0c0cf.jpeg"
    ]
  }
];

/* ---- 렌더링 ---- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const enc = p => encodeURI(p);

const main = document.getElementById("content");
const allImages = [];

main.innerHTML = lectures.map(L => {
  const meta = [
    ["일시", L.date],
    ["장소", L.place],
    ["강사", L.speaker],
    L.bio ? ["약력", L.bio] : null
  ].filter(Boolean).map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");

  const files = L.files.map(f =>
    `<a href="${enc(f.href)}" target="_blank" rel="noopener">${f.label}</a>`
  ).join("");

  const gallery = L.pics.map(name => {
    const src = enc(L.dir + name);
    const idx = allImages.push(src) - 1;
    return `<img loading="lazy" src="${src}" alt="${esc(L.tag)} 행사 사진" data-idx="${idx}">`;
  }).join("");

  return `
  <section class="lecture" id="${L.id}">
    <span class="tag">${esc(L.tag)}</span>
    <h2>${esc(L.title)}</h2>
    ${L.subtitle ? `<p class="sub">${esc(L.subtitle)}</p>` : ""}
    <dl class="meta">${meta}</dl>
    <div class="desc">${esc(L.desc)}</div>
    <div class="files">${files}</div>
    <p class="gallery-title">📷 행사 사진 (클릭하면 크게 보기)</p>
    <div class="gallery">${gallery}</div>
  </section>`;
}).join("");

/* ---- 라이트박스 ---- */
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
let cur = 0;
function show(i){
  cur = (i + allImages.length) % allImages.length;
  lbImg.src = allImages[cur];
  lb.classList.add("open");
}
main.addEventListener("click", e => {
  if(e.target.tagName === "IMG" && e.target.dataset.idx !== undefined){
    show(+e.target.dataset.idx);
  }
});
document.getElementById("lbClose").onclick = () => lb.classList.remove("open");
document.getElementById("lbPrev").onclick  = e => { e.stopPropagation(); show(cur-1); };
document.getElementById("lbNext").onclick  = e => { e.stopPropagation(); show(cur+1); };
lb.addEventListener("click", e => { if(e.target === lb) lb.classList.remove("open"); });
document.addEventListener("keydown", e => {
  if(!lb.classList.contains("open")) return;
  if(e.key === "Escape") lb.classList.remove("open");
  if(e.key === "ArrowLeft") show(cur-1);
  if(e.key === "ArrowRight") show(cur+1);
});
</script>
</body>
</html>
